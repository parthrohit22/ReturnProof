[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "returnproof"
version = "0.1.0"
description = "Evidence-driven stock return reconciliation engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
]

[project.scripts]
returnproof = "returnproof.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/returnproof"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# B008: Typer's `= typer.Argument(...)` / `typer.Option(...)` default pattern is
# idiomatic for this framework, not the mutable-default footgun the rule targets.
ignore = ["B008"]
